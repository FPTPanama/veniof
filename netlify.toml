# Next.js app at repo root → veniof.com
# publish is owned by @netlify/plugin-nextjs; do not set it to ".next".

[build]
  command = "pnpm run build"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Legacy static HTML URLs → Next locale routes
[[redirects]]
  from = "/strategy.html"
  to = "/en/strategy"
  status = 301
[[redirects]]
  from = "/projects.html"
  to = "/en/projects"
  status = 301
[[redirects]]
  from = "/team.html"
  to = "/en/team"
  status = 301
[[redirects]]
  from = "/partner.html"
  to = "/en/partner"
  status = 301
[[redirects]]
  from = "/privacy.html"
  to = "/en/privacy"
  status = 301
[[redirects]]
  from = "/es/index.html"
  to = "/es"
  status = 301
[[redirects]]
  from = "/es/estrategia.html"
  to = "/es/strategy"
  status = 301
[[redirects]]
  from = "/es/proyectos.html"
  to = "/es/projects"
  status = 301
[[redirects]]
  from = "/es/equipo.html"
  to = "/es/team"
  status = 301
[[redirects]]
  from = "/es/alianzas.html"
  to = "/es/partner"
  status = 301
[[redirects]]
  from = "/es/privacidad.html"
  to = "/es/privacy"
  status = 301
