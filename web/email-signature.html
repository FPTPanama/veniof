<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VIOF email signature</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #eef0f3;
        font-family: Arial, Helvetica, sans-serif;
        color: #101b2b;
      }
      .hint {
        max-width: 560px;
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: #36435a;
      }
      .card {
        display: inline-block;
        background: #fff;
        border: 1px solid #d2d8e0;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <p class="hint">
      Select the signature block below → Copy → Gmail → Settings → See all
      settings → General → Signature → Paste. Use the same block for both
      Gmail and the website contact emails.
    </p>
    <div class="card">
      <!-- SIGNATURE START — same markup as src/lib/emailSignature.ts -->
      <table
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="
          border-collapse: collapse;
          font-family: Georgia, 'Times New Roman', serif;
          color: #101b2b;
        "
      >
        <tr>
          <td style="padding: 0">
            <table
              cellpadding="0"
              cellspacing="0"
              border="0"
              style="border-collapse: collapse"
            >
              <tr>
                <td
                  style="
                    padding: 0 0 10px 0;
                    border-bottom: 2px solid #b08d57;
                  "
                >
                  <div
                    style="
                      font-family: Georgia, 'Times New Roman', serif;
                      font-size: 22px;
                      letter-spacing: 0.14em;
                      color: #0a1a2f;
                      line-height: 1.1;
                    "
                  >
                    VIOF
                  </div>
                  <div
                    style="
                      font-family: Arial, Helvetica, sans-serif;
                      font-size: 11px;
                      letter-spacing: 0.02em;
                      color: #556276;
                      line-height: 1.35;
                      margin-top: 6px;
                    "
                  >
                    Venezuela Infrastructure Opportunity Fund
                  </div>
                </td>
              </tr>
              <tr>
                <td
                  style="
                    padding: 12px 0 0 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 13px;
                    line-height: 1.55;
                    color: #36435a;
                  "
                >
                  <a
                    href="mailto:admin@veniof.com"
                    style="
                      color: #0a1a2f;
                      text-decoration: none;
                      font-weight: 600;
                    "
                    >admin@veniof.com</a
                  >
                  <span style="color: #b08d57">&nbsp;·&nbsp;</span>
                  <a
                    href="https://www.veniof.com"
                    style="
                      color: #0a1a2f;
                      text-decoration: none;
                      font-weight: 600;
                    "
                    >www.veniof.com</a
                  >
                </td>
              </tr>
              <tr>
                <td
                  style="
                    padding: 8px 0 0 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 12px;
                    line-height: 1.5;
                    color: #556276;
                  "
                >
                  Miami · Caracas
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
      <!-- SIGNATURE END -->
    </div>
  </body>
</html>
